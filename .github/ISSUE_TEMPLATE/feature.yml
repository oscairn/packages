name: Feature request
description: Suggest a capability or behavior
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes: {label: The problem, description: What you are trying to do and what stops you.}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior, description: How you would like it to work.}
    validations: {required: true}
